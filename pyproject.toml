[project]
name = "agentboss"
version = "0.1.0"
description = "A single dashboard for every Claude Code session on this machine: models, agents and subagents, live."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Joe Drumgoole", email = "joe@joedrumgoole.com" }]
keywords = ["claude", "claude-code", "dashboard", "fastapi", "observability"]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "pydantic>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
]

[project.scripts]
agentboss = "agentboss.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentboss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# A dedicated basetemp keeps the suite out of the shared /var/folders pytest dir,
# whose session-finish cleanup can stall for minutes when other projects have
# left large trees behind.
addopts = "--basetemp=.pytest-tmp"
tmp_path_retention_count = 1
tmp_path_retention_policy = "failed"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
